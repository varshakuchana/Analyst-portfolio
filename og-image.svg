<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Varsha Kuchana  Data and Business Analyst Portfolio">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="80" width="72" height="6" rx="3" fill="url(#accent)"/>

  <!-- Logo -->
  <text x="80" y="175" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#f1f5f9">VK</text>
  <circle cx="175" cy="158" r="9" fill="#06b6d4"/>

  <!-- Title -->
  <text x="80" y="285" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#f1f5f9">Varsha Kuchana</text>
  <text x="80" y="355" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="500" fill="#22d3ee">Data &amp; Business Analyst</text>

  <!-- Subtitle -->
  <text x="80" y="430" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#94a3b8">SQL � Python � Tableau � ETL � Dashboards</text>

  <!-- Skill pills -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
    <rect x="80" y="475" width="110" height="42" rx="21" fill="#1a2234" stroke="#06b6d4" stroke-opacity="0.35"/>
    <text x="135" y="502" fill="#22d3ee" text-anchor="middle">PostgreSQL</text>

    <rect x="205" y="475" width="88" height="42" rx="21" fill="#1a2234" stroke="#06b6d4" stroke-opacity="0.35"/>
    <text x="249" y="502" fill="#22d3ee" text-anchor="middle">Python</text>

    <rect x="308" y="475" width="96" height="42" rx="21" fill="#1a2234" stroke="#06b6d4" stroke-opacity="0.35"/>
    <text x="356" y="502" fill="#22d3ee" text-anchor="middle">Tableau</text>

    <rect x="419" y="475" width="78" height="42" rx="21" fill="#1a2234" stroke="#06b6d4" stroke-opacity="0.35"/>
    <text x="458" y="502" fill="#22d3ee" text-anchor="middle">Excel</text>

    <rect x="512" y="475" width="108" height="42" rx="21" fill="#1a2234" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <text x="566" y="502" fill="#c4b5fd" text-anchor="middle">Power BI</text>
  </g>

  <!-- URL -->
  <text x="80" y="575" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#64748b">varshakuchana.github.io/Analyst-portfolio</text>

  <!-- Decorative chart -->
  <g transform="translate(820, 120)">
    <rect x="0" y="0" width="300" height="380" rx="20" fill="#1a2234" stroke="#94a3b8" stroke-opacity="0.12"/>
    <rect x="24" y="24" width="120" height="12" rx="6" fill="#64748b" fill-opacity="0.5"/>
    <rect x="24" y="52" width="200" height="10" rx="5" fill="#64748b" fill-opacity="0.3"/>
    <rect x="40" y="300" width="36" height="56" rx="6" fill="#06b6d4" fill-opacity="0.85"/>
    <rect x="92" y="250" width="36" height="106" rx="6" fill="#06b6d4" fill-opacity="0.65"/>
    <rect x="144" y="210" width="36" height="146" rx="6" fill="#8b5cf6" fill-opacity="0.8"/>
    <rect x="196" y="170" width="36" height="186" rx="6" fill="#8b5cf6"/>
