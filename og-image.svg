    <circle cx="92" cy="150" r="6" fill="#22d3ee"/>
    <circle cx="144" cy="190" r="6" fill="#22d3ee"/>
    <circle cx="196" cy="120" r="6" fill="#22d3ee"/>
    <circle cx="248" cy="90" r="6" fill="#22d3ee"/>
